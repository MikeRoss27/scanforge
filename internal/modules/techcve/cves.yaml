# Version-based CVE correlation dataset for the techcve module.
#
# A tech entry matches when the detected version is >= min-version and
# < max-version (bounds are inclusive/exclusive). Omitting min-version means
# "any version below max-version"; omitting max-version means "any version at
# or above min-version". This file is a curated starter set — extend it with
# entries relevant to the targets you assess.
#
# epss / epss-percentile: real values from https://api.first.org/data/v1/epss
# (fetched 2026-08-09). kev: present in the CISA Known Exploited
# Vulnerabilities catalog (https://www.cisa.gov/known-exploited-vulnerabilities-catalog).
# Both are surfaced as prioritization hints in the report.

