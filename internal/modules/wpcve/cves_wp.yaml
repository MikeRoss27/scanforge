# WordPress advisory dataset for the wpcve module.
#
# Same shape as techcve's cves.yaml: an entry matches when the detected
# version is >= min-version and < max-version (bounds inclusive/exclusive).
# Omitting min-version means "any version below max-version".
#
# Curated starter set of high-impact advisories, verified against NVD on
# 2026-11-18. `tech` values: "wordpress" for the core, the plugin slug for
# plugins, "theme-<slug>" for themes. Extend this file as new advisories
# matter to the targets you assess, keeping the verification links.

- id: CVE-2022-21661
  tech: wordpress
  title: WordPress SQL injection via WP_Query before 5.8.3
  severity: high
  max-version: "5.8.3"
  reference: https://nvd.nist.gov/vuln/detail/CVE-2022-21661
  note: "Patched in 5.8.3 and backported to branches back to 3.7.37+."

- id: CVE-2021-29447
  tech: wordpress
  title: WordPress XXE in Media Library (PHP 8, authenticated) before 5.7.1
  severity: high
  min-version: "5.6.0"
  max-version: "5.7.1"
  reference: https://nvd.nist.gov/vuln/detail/CVE-2021-29447
  note: "ID3 parsing; fixed in 5.7.1 and 5.6.2."

- id: CVE-2023-2745
