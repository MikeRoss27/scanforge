id: scanforge-wordpress-config-backup-exposed

info:
  name: WordPress Config Backup Exposed
  author: ScanForge
  severity: critical
  description: A readable wp-config.php backup (or editor swap file) leaks database credentials and authentication salts.
  tags: exposure,wordpress,config,credentials
  reference:
    - https://developer.wordpress.org/advanced-administration/security/securing-wp-config/

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-config.php.bak"
      - "{{BaseURL}}/wp-config.php.old"
      - "{{BaseURL}}/wp-config.php.save"
      - "{{BaseURL}}/wp-config.php~"
      - "{{BaseURL}}/wp-config.php.swp"
      - "{{BaseURL}}/wp-config.php.txt"
      - "{{BaseURL}}/wp-config.bak"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "DB_PASSWORD"
          - "define('DB_NAME'"
          - "define('AUTH_KEY'"
        condition: or
