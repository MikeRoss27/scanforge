id: scanforge-cors-wildcard-credentials

info:
  name: CORS Misconfiguration Reflecting Arbitrary Origin with Credentials
  author: ScanForge
  severity: medium
  description: The server reflects an attacker-controlled Origin header together with Access-Control-Allow-Credentials, allowing cross-origin scripts to read authenticated responses.
  tags: misconfig,cors,http
  reference:
    - https://portswigger.net/web-security/cors

http:
  - raw:
      - |
        GET {{BaseURL}}/ HTTP/1.1
        Host: {{Hostname}}
        Origin: https://evil.scanforge.example

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Access-Control-Allow-Origin: https://evil.scanforge.example"
      - type: word
        part: header
        words:
          - "Access-Control-Allow-Credentials: true"
