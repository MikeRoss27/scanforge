name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  installers:
    name: Installer tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell installer tests
        run: |
          bash -n install.sh tests/install_sh_test.sh
          tests/install_sh_test.sh

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh tests/install_sh_test.sh tests/install_manifest_test.sh

      - name: Version manifest consistency
        if: runner.os == 'Linux'
        run: tests/install_manifest_test.sh

  installer-arch:
    name: Installer smoke test (Arch Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run isolated tests in Arch Linux
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace archlinux:latest \
            bash -c 'bash -n install.sh tests/install_sh_test.sh && tests/install_sh_test.sh'

  installer-windows:
    name: Installer tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PowerShell installer tests
        shell: pwsh
        run: tests/install_ps1_test.ps1

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Tests (avec race detector)
        run: go test -race ./...

      - name: Tests (avec couverture)
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 30

      - name: Build
        run: go build -o scanforge ./cmd/scanforge

  docker:
    runs-on: ubuntu-latest
    needs: [test, installers, installer-arch, installer-windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t scanforge:ci .
